spring.application.name=order-inventory-platform

# Configure these environment variables for your local PostgreSQL instance.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change_me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-message=always
